<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EchoGloves Pilotage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Outfit:wght@500;600&display=swap">
<style>[hidden]{display:none!important}body{margin:0}</style><style id="echo-style">:root{
  --bg:#F2F5F8;--surface:#FFFFFF;--surface-2:#F6F9FB;--sunk:#E9EFF3;--line:#DAE3EA;--line-2:#E9EEF2;
  --ink:#0F2A42;--ink-2:#4A6173;--ink-3:#8196A6;
  --navy:#12395A;--accent:#1C9E95;--accent-2:#3E93CF;--accent-soft:#DDF2F0;--accent-ink:#FFFFFF;
  --ok:#2E9D6A;--ok-soft:#DDF1E6;--warn:#C9820F;--warn-soft:#FBEBCF;--crit:#CF4A40;--crit-soft:#F8DEDB;
  --bar:#3E93CF;--weekend:rgba(18,57,90,.035);--grid:rgba(18,57,90,.06);
  --shadow:0 1px 2px rgba(15,42,66,.06),0 10px 30px rgba(15,42,66,.10);
  --radius:10px;--left:300px;--rh:32px;
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A141D;--surface:#101E2A;--surface-2:#132432;--sunk:#0D1924;--line:#20354A;--line-2:#182B3B;
  --ink:#E4EDF3;--ink-2:#A2B5C3;--ink-3:#6C8394;
  --navy:#9CC7E6;--accent:#2EBBAF;--accent-2:#58A9E0;--accent-soft:#113A3A;--accent-ink:#04211F;
  --ok:#45B985;--ok-soft:#123427;--warn:#E3A23A;--warn-soft:#3A2B10;--crit:#EC6A5F;--crit-soft:#3E1B19;
  --bar:#4A9FDA;--weekend:rgba(255,255,255,.025);--grid:rgba(255,255,255,.05);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A141D;--surface:#101E2A;--surface-2:#132432;--sunk:#0D1924;--line:#20354A;--line-2:#182B3B;
  --ink:#E4EDF3;--ink-2:#A2B5C3;--ink-3:#6C8394;
  --navy:#9CC7E6;--accent:#2EBBAF;--accent-2:#58A9E0;--accent-soft:#113A3A;--accent-ink:#04211F;
  --ok:#45B985;--ok-soft:#123427;--warn:#E3A23A;--warn-soft:#3A2B10;--crit:#EC6A5F;--crit-soft:#3E1B19;
  --bar:#4A9FDA;--weekend:rgba(255,255,255,.025);--grid:rgba(255,255,255,.05);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px 16px;gap:12px;min-height:0}

/* top bar */
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:30px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;box-shadow:0 0 0 1px var(--line)}
.brand-name{font:600 18px/1.1 var(--f-display);letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:9px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;display:flex;gap:7px;align-items:center}
.tab svg{width:15px;height:15px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,42,66,.12)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.top-actions>*{flex:none}
.brand{min-width:0}
.tabs{flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--warn)}.dot.busy{background:var(--accent-2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:3px 8px;font-size:12.5px}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-width:0;flex:0 1 240px}
.search input{border:0;outline:0;background:transparent;width:100%}
.search svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip-f{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px 2px 3px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.chip-f[aria-pressed="true"]{border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc);color:var(--ink)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:3px 9px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,42,66,.12)}
.spacer{flex:1}
.lbl{font-size:12px;color:var(--ink-3)}

.av{--rc:var(--accent);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rc);color:#fff;font:600 9.5px/1 var(--f-mono);letter-spacing:.02em;flex:none}
.av.sm{width:18px;height:18px;font-size:8.5px}
.res{display:inline-flex;align-items:center;gap:3px}
.res .av+.av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.res .own{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--rc)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.kpi{background:var(--surface);padding:10px 14px}
.kpi b{display:block;font:600 20px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.kpi.crit b{color:var(--crit)}

main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-height:0;flex:1;overflow:auto;position:relative}

/* list table */
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px}
.grid th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.grid .n{text-align:right}
.grid tr.act{cursor:pointer}
.grid tr.act:hover td{background:var(--surface-2)}
.grid tr.act.sel td{background:var(--accent-soft)}
.grid tr.sec td{background:var(--sunk);font-weight:600;border-bottom:1px solid var(--line)}
.grid tr.sec .sname{font-family:var(--f-display);font-weight:600;font-size:14px}
.caret{border:0;background:transparent;cursor:pointer;width:20px;height:20px;display:inline-grid;place-items:center;border-radius:4px;color:var(--ink-2);vertical-align:middle}
.caret svg{width:12px;height:12px;transition:transform .15s}
.caret.closed svg{transform:rotate(-90deg)}
.aname{white-space:normal;min-width:300px;width:30%}
.aname .t{display:block;line-height:1.3}
.aname .c{font:11px var(--f-mono);color:var(--ink-3)}
.wbs{font:12px var(--f-mono);color:var(--ink-3)}
.prog{display:flex;align-items:center;gap:7px;min-width:110px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;display:block}
.prog i b{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog span{font:11.5px var(--f-mono);color:var(--ink-2);width:34px;text-align:right}
.deps{display:flex;gap:3px;flex-wrap:wrap;min-width:190px;max-width:250px;white-space:normal}
.dep{font:11px/1 var(--f-mono);padding:3px 5px;border-radius:4px;background:var(--sunk);color:var(--ink-2)}
.dep.bad{background:var(--crit-soft);color:var(--crit)}
.status{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);font-weight:500}
.status.qualified{background:#E4EEF9;color:#2F6FAE}
.status.inprogress{background:var(--accent-soft);color:var(--accent)}
.status.done{background:var(--ok-soft);color:var(--ok)}
.status.cancelled{background:var(--crit-soft);color:var(--crit)}
:root[data-theme="dark"] .status.qualified{background:#132C45;color:#7DB5E8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .status.qualified{background:#132C45;color:#7DB5E8}}
.pos{color:var(--crit)}.neg{color:var(--ok)}.mut{color:var(--ink-3)}

/* timeline */
.tl{overflow:auto;flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:relative;overscroll-behavior:contain}
.tl-in{display:grid;position:relative}
.tl-corner{position:sticky;top:0;left:0;z-index:6;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:0 12px 7px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.tl-head{position:sticky;top:0;z-index:4;background:var(--surface-2);border-bottom:1px solid var(--line);height:48px}
.tl-wk{position:absolute;top:0;height:26px;border-left:1px solid var(--line);padding:5px 7px;font:500 12px/1 var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden}
.tl-wk em{font-style:normal;color:var(--ink-3);margin-left:6px;font-size:10.5px}
.tl-wk.now{color:var(--accent);background:var(--accent-soft)}
.tl-day{position:absolute;top:26px;height:22px;text-align:center;font:10.5px/22px var(--f-mono);color:var(--ink-3)}
.tl-day.we{opacity:.55}
.tl-labels{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line)}
.tl-row{height:var(--rh);display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;overflow:hidden;cursor:pointer}
.tl-row:hover{background:var(--surface-2)}
.tl-row .t{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tl-row.sec{background:var(--sunk);font:600 13px var(--f-display)}
.tl-row.ms .t{color:var(--ink-2)}
.tl-row .h{font:11.5px var(--f-mono);color:var(--ink-3)}
.tl-row.hl{background:var(--accent-soft)}
.tl-body{position:relative;overflow:hidden}
.tl-bg{position:absolute;inset:0;pointer-events:none}
.tl-we{position:absolute;top:0;bottom:0;background:var(--weekend)}
.tl-wl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.tl-rl{position:absolute;left:0;right:0;height:1px;background:var(--line-2)}
.tl-secbg{position:absolute;left:0;right:0;background:var(--sunk);opacity:.55}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);opacity:.8;pointer-events:none;z-index:2}
.tl-today::before{content:"";position:absolute;top:0;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
svg.tl-arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}
.arr{fill:none;stroke:var(--ink-3);stroke-width:1.2;opacity:.55}
.arr.bad{stroke:var(--crit);opacity:.95;stroke-width:1.6}
.arr.hl{stroke:var(--accent);opacity:1;stroke-width:2}
.bar{position:absolute;z-index:2;height:18px;border-radius:5px;background:var(--bc,var(--bar));cursor:grab;touch-action:none;box-shadow:0 1px 0 rgba(0,0,0,.08);display:flex;align-items:center;user-select:none}
.bar::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.bar .pg{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px;background:rgba(0,0,0,.22)}
.bar .hd{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:2}
.bar .hd.l{left:0}.bar .hd.r{right:0}
.bar:hover{filter:brightness(1.07)}
.bar.dim{opacity:.22}
.bar.drag{cursor:grabbing;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--bc,var(--bar)),var(--shadow);z-index:5}
.bar.moved{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--warn)}
.bar.done{background:var(--ok)}
.blabel{position:absolute;z-index:2;font:500 11px/18px var(--f-mono);color:var(--ink-2);white-space:nowrap;pointer-events:none}
.blabel b{color:var(--ink);font-weight:600}
.sbar{position:absolute;z-index:2;height:5px;background:var(--navy);border-radius:1px;pointer-events:none;opacity:.85}
.sbar::before,.sbar::after{content:"";position:absolute;top:0;width:3px;height:11px;background:var(--navy);border-radius:0 0 2px 2px}
.sbar::before{left:0}.sbar::after{right:0}
.msd{position:absolute;z-index:3;width:14px;height:14px;transform:rotate(45deg);background:var(--navy);border:2px solid var(--surface);cursor:grab;touch-action:none;box-shadow:0 0 0 1px var(--navy)}
.msd.bad{background:var(--crit);box-shadow:0 0 0 1px var(--crit)}
.drag-tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font:500 12px/1.3 var(--f-mono);padding:5px 8px;border-radius:6px;white-space:nowrap;box-shadow:var(--shadow)}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;max-width:300px;font-size:12.5px}
.tip b{display:block;font-weight:600;margin-bottom:3px}
.tip .mono{color:var(--ink-2);font-size:11.5px}

/* capacity overlay in timeline */
.cap-lab{position:sticky;left:0;bottom:0;z-index:5;background:var(--surface-2);border-right:1px solid var(--line);border-top:2px solid var(--line)}
.cap-body{position:sticky;bottom:0;z-index:4;background:var(--surface-2);border-top:2px solid var(--line)}
.cap-h{height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.cap-r{height:24px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12.5px;white-space:nowrap}
.cap-cell{position:absolute;height:20px;border-radius:4px;font:500 10.5px/20px var(--f-mono);text-align:center;overflow:hidden;white-space:nowrap;color:var(--ink-2)}

/* capacity heat */
.h0{background:transparent;color:var(--ink-3)}
.h1{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.h2{background:color-mix(in srgb,var(--accent) 34%,transparent);color:var(--ink)}
.h3{background:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--ink)}
.h4{background:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--ink)}
.h5{background:var(--crit);color:#fff}

/* capacity view */
.cap-wrap{overflow:auto;flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table.cap{border-collapse:separate;border-spacing:0}
.cap th,.cap td{border-bottom:1px solid var(--line-2);padding:0}
.cap thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font:500 11.5px var(--f-mono);color:var(--ink-2);padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.cap thead th em{display:block;font-style:normal;color:var(--ink-3);font-size:10px}
.cap thead th.now{color:var(--accent)}
.cap .rh{position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--line);padding:8px 12px;text-align:left;min-width:250px;max-width:250px}
.rh-in>div{min-width:0}
.cap thead .rh{z-index:3;background:var(--surface-2);font-family:var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.rh-in{display:flex;align-items:center;gap:9px}
.rh-in .nm{font-weight:600}
.rh-in .tm{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.rh-in .dflt{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--ink-3)}
.hin{width:38px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 3px;text-align:right;font:12px var(--f-mono)}
.hin.ov{border-color:var(--accent-2);color:var(--accent-2);font-weight:600}
.cc{width:86px;white-space:nowrap;height:54px;margin:3px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;border:1px solid transparent;position:relative}
.cc:hover{border-color:var(--ink-3)}
.cc.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cc .p{font:600 13px/1 var(--f-mono)}
.cc .l{font:10.5px/1 var(--f-mono);opacity:.85}
.cc input{width:26px;border:0;background:transparent;text-align:right;font:10.5px var(--f-mono);padding:0;color:inherit;border-bottom:1px dashed currentColor}
.cc input.ov{font-weight:700}
.cap tr.tot .rh,.cap tr.tot td{background:var(--sunk)}
.legend{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:8px}
.detail h3{margin:0;font:600 15px var(--f-display)}
.dl{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13px}
.dl .mono{text-align:right}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,20,30,.28);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dr-h .ref{font:11.5px var(--f-mono);color:var(--ink-3)}
.dr-h h2{margin:2px 0 0;font:600 18px/1.25 var(--f-display);text-wrap:balance}
.dr-b{overflow-y:auto;overflow-x:hidden;padding:14px 18px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.fg>*{min-width:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:grid;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f>label,.sub{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;min-width:0}
.inp:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:60px}
.sub{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sub .spacer{flex:1}
table.as{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.as th:nth-child(1){width:34%}.as th:last-child{width:34px}
.as td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as th{font-size:11px;color:var(--ink-3);font-weight:500;text-align:right;padding:4px}
.as th:first-child{text-align:left}
.as td{padding:3px 4px;border-top:1px solid var(--line-2)}
.as td .inp{text-align:right;padding:4px 6px;font-family:var(--f-mono)}
.as tfoot td{font:600 12.5px var(--f-mono);text-align:right;padding:6px 4px}

.lnk{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line-2);font-size:13px}
.lnk .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:0;background:transparent;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--ink-3);flex:none}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn svg{width:15px;height:15px}
.warnbox{background:var(--crit-soft);color:var(--crit);border-radius:7px;padding:7px 10px;font-size:12.5px}

/* menu, modal, toast */
.menu-w{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:270px}
.menu button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;align-items:flex-start}
.menu button:hover{background:var(--sunk)}
.menu button svg{width:16px;height:16px;margin-top:2px;color:var(--ink-3);flex:none}
.menu small{display:block;color:var(--ink-3);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px;border:1px solid var(--line)}

.empty h3{margin:0;font:600 18px var(--f-display);color:var(--ink)}

  .top{gap:10px}
  .search{flex:1 1 100%}
  .fg{grid-template-columns:1fr}
}
